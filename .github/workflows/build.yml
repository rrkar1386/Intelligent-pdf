name: Build Smart PDF Reader V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - 'app/**'

jobs:
  build:
    name: Build Smart PDF Reader APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/smartpdfreader/MainActivity.kt

          echo "Smart PDF Reader V1 project files verified."

      - name: Build debug APK
        run: |
          set -e
          gradle clean assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

          echo "Checking APK integrity..."
          unzip -tq "$APK" >/dev/null

          echo "APK verification successful."

      - name: Upload V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-V1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
