name: Build SmartPDFReader V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build SmartPDFReader V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract SmartPDFReader V3
        run: |
          set -e

          ZIP="SmartPDFReader_V3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            echo "ZIP files in repository:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf build_source
          mkdir build_source

          unzip -q "$ZIP" -d build_source

          echo "Extracted project:"
          find build_source -maxdepth 3 -type f | sort

      - name: Locate Android project
        run: |
          set -e

          PROJECT_DIR=$(find build_source \
            -type f \
            -name "settings.gradle" \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Contents of build_source:"
            find build_source -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project root:"
          pwd

          echo
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          unzip -tq "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-V3-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
