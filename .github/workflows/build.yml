name: SmartPDFReader V2 – Structural Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build SmartPDFReader V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project structure
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/smartpdfreader/MainActivity.kt

          echo "Project structure verified."

      - name: Build debug APK
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"
          unzip -tq "$APK"

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFReader-V2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
